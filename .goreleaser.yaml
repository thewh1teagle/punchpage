version: 2

project_name: punchpage

builds:
  - main: ./cmd/punch
    binary: punch
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  # Version-free names so install scripts can fetch latest/download/<file>.
  - name_template: "punch_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  draft: false

changelog:
  use: github-native
