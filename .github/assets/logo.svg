<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="PunchPage">
  <title>PunchPage</title>
  <style>
    .mark { fill: #6d28d9; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #a78bfa; }
    }
  </style>
  <!-- Two halves of a rounded square, driven apart along the diagonal:
       a direct channel punched between two peers, with an aperture at
       the point where they meet. The lower half is the upper half
       rotated 180deg, so the mark is point-symmetric. -->
  <g class="mark">
    <path transform="translate(-1.35 -1.35)"
          d="M3.5 10A6.5 6.5 0 0 1 10 3.5H22A6.5 6.5 0 0 1 26.596 5.404L19.182 12.818H12.818V19.182L5.404 26.596A6.5 6.5 0 0 1 3.5 22Z"/>
    <path transform="rotate(180 16 16) translate(-1.35 -1.35)"
          d="M3.5 10A6.5 6.5 0 0 1 10 3.5H22A6.5 6.5 0 0 1 26.596 5.404L19.182 12.818H12.818V19.182L5.404 26.596A6.5 6.5 0 0 1 3.5 22Z"/>
  </g>
</svg>
